name: MCFactor
version: '${project.version}'
main: net.enabify.mcfactor.bukkit.MCFactorBukkit
api-version: 1.13
author: Enabify
description: Two-factor authentication plugin for Minecraft servers
website: https://mcfactor.enabify.net
folia-supported: true

# Plugin Messaging Channels for Proxy communication
channels:
  - mcfactor:authstate

commands:
  2fa:
    description: Two-factor authentication commands
    aliases: [2f]
    usage: /<command> [appkey|help|disconnect]

permissions:
  mcfactor.admin:
    description: Allows admin commands
    default: op
